
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Vezash - النقاط والعملات</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;background:#0b1120;
 color:#fff;min-height:100vh;padding:20px 14px;
}
main{max-width:480px;margin:auto}
header{text-align:center;padding:20px 0 25px}
.logo{font-size:34px;font-weight:900;letter-spacing:2px;color:#62e6c4}
header p{color:#9eabc0;margin-top:8px}
.card{
 background:#141f32;border:1px solid #28364d;
 border-radius:20px;padding:20px;margin-bottom:15px;
}
h2{font-size:19px;margin:0 0 17px}
.balances{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.balance{background:#1d2a40;border-radius:15px;padding:16px 10px;text-align:center}
.balance span{display:block;color:#aebbd0;font-size:14px;margin-bottom:10px}
.balance strong{font-size:27px;color:#62e6c4}
.balance.coins strong{color:#ffd166}
button{
 border:0;border-radius:12px;padding:14px 12px;
 font-size:16px;font-weight:bold;cursor:pointer;width:100%;
 background:#62e6c4;color:#102033;margin-top:12px;
}
button.secondary{background:#273750;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
.info{color:#aebbd0;font-size:13px;line-height:1.8;margin:12px 0 0}
.status{margin-top:13px;font-size:14px;line-height:1.8;color:#62e6c4}
.product{display:flex;justify-content:space-between;align-items:center;gap:12px}
.product button{width:auto;min-width:112px;margin:0}
.product small{display:block;color:#aebbd0;margin-top:7px}
#message{min-height:24px;text-align:center;font-size:14px;line-height:1.8}
footer{text-align:center;color:#76849b;font-size:12px;padding:10px}
</style>
</head>
<body>
<main>
<header>
 <div class="logo">VEZASH</div>
 <p>اجمع نقاطك واستبدلها بالعملات</p>
</header>

<section class="card">
 <h2>رصيدك</h2>
 <div class="balances">
  <div class="balance">
   <span>⭐ النقاط</span>
   <strong id="points">0</strong>
  </div>
  <div class="balance coins">
   <span>🪙 العملات</span>
   <strong id="coins">0</strong>
  </div>
 </div>
</section>

<section class="card">
 <h2>🎁 المكافأة اليومية</h2>
 <p class="info">احصل على 10 نقاط مرة كل 24 ساعة.</p>
 <button id="claimBtn" onclick="claimReward()">استلام المكافأة</button>
 <div id="timer" class="status"></div>
</section>

<section class="card">
 <h2>🛍️ متجر العملات</h2>
 <div class="product">
  <div>
   <strong>10 عملات 🪙</strong>
   <small>السعر: 100 نقطة ⭐</small>
  </div>
  <button onclick="buyCoins()">شراء</button>
 </div>
 <p class="info">اجمع النقاط اليومية حتى تقدر تشتري العملات.</p>
</section>

<div id="message" role="status" aria-live="polite"></div>
<footer>VEZASH ©</footer>
</main>

<script>
const REWARD_POINTS = 10;
const WAIT_MS = 24 * 60 * 60 * 1000;
const PRICE_POINTS = 100;
const REWARD_COINS = 10;

const KEYS = {
 points: "vezash_points",
 coins: "vezash_coins",
 lastClaim: "vezash_last_claim"
};

function getNumber(key) {
 const value = Number(localStorage.getItem(key) || 0);
 return Number.isFinite(value) && value >= 0 ? value : 0;
}

function showMessage(text) {
 document.getElementById("message").textContent = text;
}

function render() {
 document.getElementById("points").textContent = getNumber(KEYS.points);
 document.getElementById("coins").textContent = getNumber(KEYS.coins);
 updateTimer();
}

function claimReward() {
 const now = Date.now();
 const last = getNumber(KEYS.lastClaim);

 if (last > 0 && now - last < WAIT_MS) {
  showMessage("استلمت مكافأتك مسبقاً. انتظر انتهاء الوقت.");
  updateTimer();
  return;
 }

 localStorage.setItem(KEYS.points, getNumber(KEYS.points) + REWARD_POINTS);
 localStorage.setItem(KEYS.lastClaim, now);
 showMessage("مبروك! حصلت على 10 نقاط ⭐");
 render();
}

function buyCoins() {
 const points = getNumber(KEYS.points);

 if (points < PRICE_POINTS) {
  showMessage("نقاطك ما تكفي. تحتاج 100 نقطة للشراء.");
  return;
 }

 localStorage.setItem(KEYS.points, points - PRICE_POINTS);
 localStorage.setItem(KEYS.coins, getNumber(KEYS.coins) + REWARD_COINS);
 showMessage("تم الشراء! أضفنا 10 عملات إلى رصيدك 🪙");
 render();
}

function updateTimer() {
 const last = getNumber(KEYS.lastClaim);
 const btn = document.getElementById("claimBtn");
 const timer = document.getElementById("timer");

 if (!last || Date.now() - last >= WAIT_MS) {
  btn.disabled = false;
  btn.textContent = "استلام المكافأة";
  timer.textContent = "مكافأتك اليومية جاهزة!";
  return;
 }

 btn.disabled = true;
 btn.textContent = "المكافأة غير متاحة حالياً";

 const remaining = WAIT_MS - (Date.now() - last);
 const hours = Math.floor(remaining / 3600000);
 const minutes = Math.floor((remaining % 3600000) / 60000);
 const seconds = Math.floor((remaining % 60000) / 1000);

 timer.textContent = `المكافأة القادمة بعد: ${hours} ساعة و${minutes} دقيقة و${seconds} ثانية`;
}

render();
setInterval(updateTimer, 1000);
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VEZASH App</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, sans-serif;
}

body {
  background-color: #0b0b0e;
  color: #f0f0f0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
}

.auth-card {
  width: 100%;
  max-width: 380px;
  background: #141419;
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-radius: 20px;
  padding: 24px 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
}

.brand {
  text-align: center;
  margin-bottom: 24px;
}

.brand h1 {
  color: #d4af37;
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 4px;
}

.brand p {
  color: #888890;
  font-size: 13px;
}

.nav-tabs {
  display: flex;
  background: #09090c;
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 20px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.tab {
  flex: 1;
  background: transparent;
  border: none;
  color: #888890;
  padding: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border-radius: 9px;
  text-align: center;
  transition: 0.2s;
}

.tab.active {
  background: #d4af37;
  color: #0b0b0e;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 12px;
  color: #a0a0a5;
  margin-bottom: 6px;
  font-weight: 600;
}

.input-box {
  width: 100%;
  padding: 12px 14px;
  background: #09090c;
  border: 1px solid #2a2a32;
  border-radius: 12px;
  color: #fff;
  font-size: 14px;
  outline: none;
}

.input-box:focus {
  border-color: #d4af37;
}

.action-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #d4af37, #aa8c2c);
  color: #0b0b0e;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 10px;
}

.status-text {
  text-align: center;
  font-size: 13px;
  margin-top: 14px;
  font-weight: 700;
  min-height: 18px;
}

.status-text.err { color: #ff5555; }
.status-text.ok { color: #44ff88; }

.dashboard {
  text-align: center;
  padding: 10px 0;
}

.dashboard h2 {
  color: #d4af37;
  font-size: 20px;
  margin-bottom: 8px;
}

.dashboard p {
  color: #a0a0a5;
  font-size: 14px;
  margin-bottom: 20px;
}

.out-btn {
  background: transparent;
  border: 1px solid #ff5555;
  color: #ff5555;
  padding: 10px 24px;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="auth-card">
  
  <!-- نموذج الدخول والتسجيل -->
  <div id="guestView">
    <div class="brand">
      <h1>VEZASH</h1>
      <p>بوابة المستخدمين والتحكم</p>
    </div>

    <div class="nav-tabs">
      <button class="tab active" id="tLogin" onclick="changeMode('login')">تسجيل دخول</button>
      <button class="tab" id="tRegister" onclick="changeMode('register')">حساب جديد</button>
    </div>

    <!-- فورم الدخول -->
    <div id="boxLogin">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="lEmail" class="input-box" placeholder="name@example.com">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="lPass" class="input-box" placeholder="••••••••">
      </div>
      <button class="action-btn" onclick="doLogin()">تسجيل الدخول</button>
    </div>

    <!-- فورم التسجيل -->
    <div id="boxRegister" style="display: none;">
      <div class="field">
        <label>اسم المستخدم</label>
        <input type="text" id="rName" class="input-box" placeholder="اسمك الكريم">
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="rEmail" class="input-box" placeholder="name@example.com">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="rPass" class="input-box" placeholder="••••••••">
      </div>
      <button class="action-btn" onclick="doRegister()">إنشاء الحساب</button>
    </div>

    <div class="status-text" id="feedback"></div>
  </div>

  <!-- لوحة معلومات المستخدم بعد الدخول -->
  <div id="userView" style="display: none;" class="dashboard">
    <h2>أهلاً بك مجدداً 🔥</h2>
    <p id="loggedUserEmail"></p>
    <button class="out-btn" onclick="doLogout()">تسجيل الخروج</button>
  </div>

</div>

<script>
const SESSION_KEY = 'vezash_github_session';

function initApp() {
  const sessionData = localStorage.getItem(SESSION_KEY);
  if (sessionData) {
    const user = JSON.parse(sessionData);
    document.getElementById('guestView').style.display = 'none';
    document.getElementById('userView').style.display = 'block';
    document.getElementById('loggedUserEmail').textContent = user.email;
  } else {
    document.getElementById('guestView').style.display = 'block';
    document.getElementById('userView').style.display = 'none';
  }
}

function changeMode(mode) {
  const tLogin = document.getElementById('tLogin');
  const tRegister = document.getElementById('tRegister');
  const boxLogin = document.getElementById('boxLogin');
  const boxRegister = document.getElementById('boxRegister');
  document.getElementById('feedback').textContent = '';

  if (mode === 'login') {
    tLogin.classList.add('active');
    tRegister.classList.remove('active');
    boxLogin.style.display = 'block';
    boxRegister.style.display = 'none';
  } else {
    tRegister.classList.add('active');
    tLogin.classList.remove('active');
    boxRegister.style.display = 'block';
    boxLogin.style.display = 'none';
  }
}

function showMsg(text, type) {
  const fb = document.getElementById('feedback');
  fb.textContent = text;
  fb.className = 'status-text ' + type;
}

function doLogin() {
  const email = document.getElementById('lEmail').value.trim();
  const pass = document.getElementById('lPass').value.trim();

  if (!email || !pass) {
    showMsg('يرجى ملء جميع الحقول', 'err');
    return;
  }

  localStorage.setItem(SESSION_KEY, JSON.stringify({ email: email }));
  showMsg('تم تسجيل الدخول بنجاح', 'ok');
  setTimeout(initApp, 400);
}

function doRegister() {
  const name = document.getElementById('rName').value.trim();
  const email = document.getElementById('rEmail').value.trim();
  const pass = document.getElementById('rPass').value.trim();

  if (!name || !email || !pass) {
    showMsg('يرجى ملء كافة الحقول المطلوبة', 'err');
    return;
  }

  localStorage.setItem(SESSION_KEY, JSON.stringify({ name: name, email: email }));
  showMsg('تم إنشاء الحساب بنجاح', 'ok');
  setTimeout(initApp, 400);
}

function doLogout() {
  localStorage.removeItem(SESSION_KEY);
  document.getElementById('lEmail').value = '';
  document.getElementById('lPass').value = '';
  document.getElementById('feedback').textContent = '';
  initApp();
}

window.onload = initApp;
</script>

</body>
</html>

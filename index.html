
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vezash - تسجيل الدخول</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#101522;color:white;font-family:Arial,sans-serif}
.card{width:100%;max-width:380px;padding:28px 22px;background:#1b2335;border:1px solid #303b52;border-radius:22px;text-align:center}
.logo{width:68px;height:68px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:#3478f6;border-radius:20px;font-size:30px;font-weight:bold}
h2{margin:0 0 10px;font-size:25px}
.desc{color:#aeb9cc;font-size:14px;margin-bottom:25px;line-height:1.7}
label{display:block;text-align:right;margin:12px 0 8px;color:#d9e2f2;font-size:14px}
input{width:100%;padding:15px;margin-bottom:13px;background:#111827;border:1px solid #39445b;border-radius:12px;color:white;font-size:16px;outline:none;direction:ltr;text-align:left}
input:focus{border-color:#3478f6}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#3478f6;color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:5px}
button:disabled{opacity:.65;cursor:wait}
.secondary{background:transparent;color:#8eb5ff;margin-top:12px;border:1px solid #39445b}
#msg{font-size:14px;color:#ffcc80;margin-top:16px;line-height:1.8;overflow-wrap:anywhere}
#recaptcha-container{display:flex;justify-content:center;margin:12px 0;overflow:hidden}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="card">
  <div class="logo">V</div>
  <h2>أهلاً بيك</h2>
  <div class="desc" id="desc">سجّل دخولك برقم هاتفك حتى تتابع</div>

  <section id="phoneSection">
    <label for="phone">رقم الهاتف العراقي</label>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07XXXXXXXXX">
    <div id="recaptcha-container"></div>
    <button id="sendBtn" type="button">إرسال رمز التحقق</button>
  </section>

  <section id="codeSection" class="hidden">
    <label for="otp">رمز التحقق المرسل برسالة SMS</label>
    <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="أدخل الرمز">
    <button id="verifyBtn" type="button">تأكيد الرمز وتسجيل الدخول</button>
    <button id="backBtn" type="button" class="secondary">تغيير رقم الهاتف</button>
  </section>

  <div id="msg" role="status" aria-live="polite"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVg6fylaZjhgtAlh_LNIOpExpBa0FZ21g",
  authDomain: "vezash.firebaseapp.com",
  databaseURL: "https://vezash-default-rtdb.firebaseio.com",
  projectId: "vezash",
  storageBucket: "vezash.firebasestorage.app",
  messagingSenderId: "1069891769244",
  appId: "1:1069891769244:web:1056f47de64789c1406e59",
  measurementId: "G-02CRNVKKEL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
auth.languageCode = "ar";

const $ = id => document.getElementById(id);
const phoneSection = $("phoneSection");
const codeSection = $("codeSection");
const phoneInput = $("phone");
const otpInput = $("otp");
const sendBtn = $("sendBtn");
const verifyBtn = $("verifyBtn");
const backBtn = $("backBtn");
const msg = $("msg");

let verifier = null;
let confirmation = null;
let widgetRendered = false;

function message(text, color = "") {
  msg.textContent = text;
  msg.style.color = color || "#ffcc80";
}

function normalizePhone(value) {
  let n = value.trim().replace(/[\s()-]/g, "");
  if (n.startsWith("00")) n = "+" + n.slice(2);
  if (n.startsWith("964")) n = "+" + n;
  if (n.startsWith("07")) n = "+964" + n.slice(1);
  if (n.startsWith("7")) n = "+964" + n;

  if (!/^\+9647\d{9}$/.test(n)) {
    throw new Error("أدخل رقمًا عراقيًا صحيحًا، مثل 07XXXXXXXXX");
  }
  return n;
}

function setupRecaptcha() {
  if (verifier) return;
  verifier = new RecaptchaVerifier(auth, "recaptcha-container", {
    size: "normal",
    callback: () => {},
    "expired-callback": () => message("انتهت صلاحية التحقق. أعد المحاولة.")
  });
}

function errorText(error) {
  const errors = {
    "auth/invalid-phone-number": "رقم الهاتف غير صحيح.",
    "auth/too-many-requests": "محاولات كثيرة. انتظر قليلًا ثم حاول.",
    "auth/quota-exceeded": "تم تجاوز حد رسائل التحقق المتاح.",
    "auth/captcha-check-failed": "فشل التحقق. راجع إعدادات Firebase والنطاق.",
    "auth/operation-not-allowed": "فعّل تسجيل الدخول بالهاتف في Firebase.",
    "auth/unauthorized-domain": "نطاق الصفحة غير مسموح في Firebase.",
    "auth/invalid-verification-code": "رمز التحقق غير صحيح.",
    "auth/code-expired": "انتهت صلاحية الرمز. أرسل رمزًا جديدًا.",
    "auth/network-request-failed": "تعذّر الاتصال بالإنترنت."
  };
  return errors[error.code] || "تعذّرت العملية: " + (error.code || error.message);
}

sendBtn.addEventListener("click", async () => {
  sendBtn.disabled = true;
  try {
    const phone = normalizePhone(phoneInput.value);
    setupRecaptcha();

    if (!widgetRendered) {
      await verifier.render();
      widgetRendered = true;
    }

    message("أكمل اختبار التحقق، ثم انتظر رسالة SMS.");
    confirmation = await signInWithPhoneNumber(auth, phone, verifier);

    phoneSection.classList.add("hidden");
    codeSection.classList.remove("hidden");
    message("تم إرسال رمز التحقق إلى " + phone, "#8eb5ff");
    otpInput.focus();
  } catch (error) {
    console.error(error);
    message(errorText(error));
    sendBtn.disabled = false;
  }
});

verifyBtn.addEventListener("click", async () => {
  const code = otpInput.value.trim();
  if (!confirmation) {
    message("أرسل رمز التحقق أولًا.");
    return;
  }
  if (!/^\d{6}$/.test(code)) {
    message("أدخل رمز التحقق المكوّن من 6 أرقام.");
    return;
  }

  verifyBtn.disabled = true;
  try {
    const result = await confirmation.confirm(code);
    message("تم تسجيل الدخول بنجاح ✅", "#8eb5ff");

    if (window.parent !== window) {
      window.parent.postMessage({
        type: "VEZASH_LOGIN_SUCCESS",
        uid: result.user.uid,
        phoneNumber: result.user.phoneNumber
      }, "*");
    }
  } catch (error) {
    console.error(error);
    message(errorText(error));
    verifyBtn.disabled = false;
  }
});

backBtn.addEventListener("click", () => {
  confirmation = null;
  otpInput.value = "";
  codeSection.classList.add("hidden");
  phoneSection.classList.remove("hidden");
  sendBtn.disabled = false;
  message("");
});
</script>
</body>
</html>

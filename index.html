<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vezash - تسجيل الدخول</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#101522;color:white;font-family:Arial,sans-serif}
.card{width:100%;max-width:380px;padding:28px 22px;background:#1b2335;border:1px solid #303b52;border-radius:22px;text-align:center}
.logo{width:68px;height:68px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:#3478f6;border-radius:20px;font-size:30px;font-weight:bold}
h2{margin:0 0 10px;font-size:25px}
.desc{color:#aeb9cc;font-size:14px;margin-bottom:25px}
input{width:100%;padding:15px;margin-bottom:13px;background:#111827;border:1px solid #39445b;border-radius:12px;color:white;font-size:15px;outline:none}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#3478f6;color:white;font-size:16px;font-weight:bold;cursor:pointer;margin-top:5px}
.secondary{background:transparent;color:#8eb5ff;margin-top:12px}
#msg{font-size:14px;color:#ffcc80;margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <div class="logo">V</div>
  <h2 id="heading">أهلاً بيك</h2>
  <div class="desc" id="desc">سجّل دخولك حتى تتابع</div>
  <form id="authForm">
    <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
    <input id="password" type="password" placeholder="كلمة السر (6 أحرف على الأقل)" autocomplete="current-password" minlength="6" required>
    <button id="mainBtn" type="submit">تسجيل الدخول</button>
  </form>
  <button class="secondary" id="switchBtn" type="button">إنشاء حساب جديد</button>
  <div id="msg" role="status"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVg6fylaZjhgtAlh_LNIOpExpBa0FZ21g",
  authDomain: "vezash.firebaseapp.com",
  databaseURL: "https://vezash-default-rtdb.firebaseio.com",
  projectId: "vezash",
  storageBucket: "vezash.firebasestorage.app",
  messagingSenderId: "1069891769244",
  appId: "1:1069891769244:web:1056f47de64789c1406e59",
  measurementId: "G-02CRNVKKEL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let isSignup = false;

const form = document.getElementById("authForm");
const msg = document.getElementById("msg");
const mainBtn = document.getElementById("mainBtn");
const switchBtn = document.getElementById("switchBtn");
const passwordInput = document.getElementById("password");

switchBtn.addEventListener("click", () => {
  isSignup = !isSignup;
  document.getElementById("heading").textContent =
    isSignup ? "إنشاء حساب جديد" : "أهلاً بيك";
  document.getElementById("desc").textContent =
    isSignup ? "أنشئ حسابك للبدء" : "سجّل دخولك حتى تتابع";
  mainBtn.textContent = isSignup ? "إنشاء حساب" : "تسجيل الدخول";
  switchBtn.textContent = isSignup ? "عندي حساب بالفعل" : "إنشاء حساب جديد";
  passwordInput.autocomplete = isSignup ? "new-password" : "current-password";
  msg.textContent = "";
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = passwordInput.value;
  mainBtn.disabled = true;
  mainBtn.textContent = "لحظة من فضلك...";
  msg.textContent = "";

  try {
    if (isSignup) {
      await createUserWithEmailAndPassword(auth, email, password);
      msg.textContent = "تم إنشاء الحساب بنجاح!";
    } else {
      await signInWithEmailAndPassword(auth, email, password);
      msg.textContent = "تم تسجيل الدخول بنجاح!";
    }
  } catch (error) {
    const errors = {
      "auth/email-already-in-use": "هذا البريد مسجل مسبقاً. جرّب تسجيل الدخول.",
      "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
      "auth/weak-password": "كلمة السر ضعيفة. استخدم 6 أحرف على الأقل.",
      "auth/invalid-credential": "البريد أو كلمة السر غير صحيحة.",
      "auth/network-request-failed": "تعذر الاتصال. تحقق من الإنترنت وحاول مجدداً.",
      "auth/too-many-requests": "محاولات كثيرة. انتظر قليلاً ثم حاول مجدداً.",
      "auth/operation-not-allowed": "تسجيل البريد الإلكتروني غير مفعّل في Firebase."
    };
    msg.textContent = errors[error.code] || "تعذرت العملية. رمز الخطأ: " + error.code;
  } finally {
    mainBtn.disabled = false;
    mainBtn.textContent = isSignup ? "إنشاء حساب" : "تسجيل الدخول";
  }
});
</script>
</body>
</html>

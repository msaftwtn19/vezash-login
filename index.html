
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEZASH - النقاط والعملات</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  font-family:Arial,sans-serif;
  background:#07111f;color:#fff;
}
.container{max-width:500px;margin:auto}
header{text-align:center;padding:25px 0}
.logo{font-size:36px;font-weight:bold;color:#55d6ff}
.subtitle{color:#a8b7ca;margin-top:10px}
.card{
  background:#111f33;
  border:1px solid #263c57;
  border-radius:18px;
  padding:20px;margin-bottom:16px;
}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center}
.number{font-size:30px;font-weight:bold;margin:14px 0;color:#55d6ff}
h2{font-size:19px;margin-top:0}
button{
  width:100%;padding:14px;border:0;border-radius:12px;
  background:#45c7f5;color:#06111e;
  font-size:16px;font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.5;cursor:not-allowed}
.note{color:#a8b7ca;font-size:13px;line-height:1.8}
#message{margin:12px 0;line-height:1.8}
</style>
</head>

<body>
<div class="container">
  <header>
    <div class="logo">VEZASH</div>
    <div class="subtitle">اجمع النقاط واستبدلها بالعملات</div>
  </header>

  <div class="card stats">
    <div class="stat">
      <h2>⭐ نقاطك</h2>
      <div class="number" id="points">0</div>
    </div>
    <div class="stat">
      <h2>🪙 عملاتك</h2>
      <div class="number" id="coins">0</div>
    </div>
  </div>

  <div class="card">
    <h2>🎁 المكافأة اليومية</h2>
    <p>استلم 10 نقاط كل 24 ساعة.</p>
    <button id="claimBtn" disabled>جاري الاتصال...</button>
    <p class="note" id="timer"></p>
  </div>

  <div class="card">
    <h2>🛒 متجر العملات</h2>
    <p>استبدل 100 نقطة مقابل 10 عملات.</p>
    <button id="buyBtn" disabled>استبدال 100 نقطة</button>
  </div>

  <div id="message" role="status">جاري الاتصال بقاعدة البيانات...</div>
  <p class="note">VEZASH ©</p>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import { getAuth, signInAnonymously }
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import { getDatabase, ref, get, runTransaction }
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVg6fylaZjhgtAlh_LNIOpExpBa0FZ21g",
  authDomain: "vezash.firebaseapp.com",
  databaseURL: "https://vezash-default-rtdb.firebaseio.com",
  projectId: "vezash",
  storageBucket: "vezash.firebasestorage.app",
  messagingSenderId: "1069891769244",
  appId: "1:1069891769244:web:1056f47de64789c1406e59",
  measurementId: "G-02CRNVKKEL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const pointsEl = document.getElementById("points");
const coinsEl = document.getElementById("coins");
const claimBtn = document.getElementById("claimBtn");
const buyBtn = document.getElementById("buyBtn");
const timerEl = document.getElementById("timer");
const messageEl = document.getElementById("message");

const DAY = 24 * 60 * 60 * 1000;
let userRef = null;
let busy = false;

function message(text) {
  messageEl.textContent = text;
}

function showData(data) {
  const points = Number(data.points || 0);
  const coins = Number(data.coins || 0);
  const lastClaim = Number(data.lastClaim || 0);

  pointsEl.textContent = points;
  coinsEl.textContent = coins;

  const remaining = DAY - (Date.now() - lastClaim);

  claimBtn.disabled = busy || remaining > 0;

  if (remaining <= 0) {
    claimBtn.textContent = "استلام 10 نقاط";
    timerEl.textContent = "مكافأتك اليومية جاهزة!";
  } else {
    claimBtn.textContent = "تم استلام المكافأة";
    const hours = Math.floor(remaining / 3600000);
    const minutes = Math.ceil((remaining % 3600000) / 60000);
    timerEl.textContent =
      `المكافأة القادمة بعد ${hours} ساعة و${minutes} دقيقة تقريباً`;
  }

  buyBtn.disabled = busy || points < 100;
}

async function refresh() {
  const snapshot = await get(userRef);
  showData(snapshot.val() || {
    points: 0,
    coins: 0,
    lastClaim: 0
  });
}

async function transact(action) {
  if (busy || !userRef) return;

  busy = true;
  claimBtn.disabled = true;
  buyBtn.disabled = true;
  message("جاري تنفيذ العملية...");

  try {
    let reason = "";

    const result = await runTransaction(userRef, current => {
      const data = current || {
        points: 0,
        coins: 0,
        lastClaim: 0
      };

      data.points = Number(data.points || 0);
      data.coins = Number(data.coins || 0);
      data.lastClaim = Number(data.lastClaim || 0);

      if (action === "claim") {
        if (Date.now() - data.lastClaim < DAY) {
          reason = "استلمت المكافأة خلال آخر 24 ساعة.";
          return;
        }

        data.points += 10;
        data.lastClaim = Date.now();
      }

      if (action === "buy") {
        if (data.points < 100) {
          reason = "تحتاج إلى 100 نقطة حتى تستبدلها.";
          return;
        }

        data.points -= 100;
        data.coins += 10;
      }

      return data;
    });

    if (result.committed) {
      message(action === "claim"
        ? "تمت إضافة 10 نقاط إلى رصيدك!"
        : "تم استبدال 100 نقطة بـ10 عملات!");
    } else {
      message(reason || "لم تكتمل العملية. حاول مرة ثانية.");
    }

    await refresh();
  } catch (error) {
    console.error(error);
    message("تعذر الاتصال بقاعدة البيانات. تحقق من إعدادات Firebase.");
  } finally {
    busy = false;
    try {
      await refresh();
    } catch (error) {
      console.error(error);
    }
  }
}

claimBtn.addEventListener("click", () => transact("claim"));
buyBtn.addEventListener("click", () => transact("buy"));

async function start() {
  try {
    const credential = await signInAnonymously(auth);
    userRef = ref(db, "users/" + credential.user.uid);

    await refresh();
    message("تم الاتصال بـ VEZASH بنجاح.");
  } catch (error) {
    console.error(error);
    message("فشل الاتصال. تأكد من تفعيل Anonymous Auth وقواعد قاعدة البيانات في Firebase.");
  }
}

start();
</script>
</body>
</html>

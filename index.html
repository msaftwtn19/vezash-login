<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VEZASH | العداد اليومي</title>

<style>
:root {
  --bg: #0a0a0c;
  --card-bg: rgba(18, 18, 22, 0.85);
  --gold: #d4af37;
  --gold-glow: #ffd700;
  --text: #f0f0f0;
  --muted: #a0a0a0;
  --danger: #ff5555;
  --green: #44ff88;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 16px;
  background: 
    linear-gradient(to bottom, rgba(10, 10, 12, 0.85), rgba(10, 10, 12, 0.95)),
    url('https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=1000&q=80') center/cover no-repeat fixed;
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* بطاقة تسجيل الدخول علوياً */
.card-auth {
  background: var(--card-bg);
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.auth-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--gold);
  text-align: center;
  margin-bottom: 15px;
}

.input-group {
  margin-bottom: 12px;
}

.input-group label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 5px;
}

.input-control {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.5);
  color: var(--text);
  font-size: 14px;
  outline: none;
}

.input-control:focus {
  border-color: var(--gold);
}

.btn-auth {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--gold), #997a15);
  color: #000;
  font-weight: 800;
  font-size: 15px;
  cursor: pointer;
  margin-top: 8px;
}

.btn-auth:active { transform: scale(0.98); }

.auth-status {
  text-align: center;
  font-size: 12px;
  margin-top: 10px;
  min-height: 18px;
}
.auth-status.error { color: var(--danger); }
.auth-status.ok { color: var(--green); }

/* بطاقة العداد والزر */
.card-timer {
  background: var(--card-bg);
  border: 1px solid rgba(212, 175, 55, 0.4);
  border-radius: 24px;
  padding: 30px 20px;
  text-align: center;
  backdrop-filter: blur(10px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.9);
}

.points-badge {
  display: inline-block;
  background: rgba(212, 175, 55, 0.15);
  border: 1px solid var(--gold);
  color: var(--gold);
  padding: 6px 16px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 20px;
}

.timer-display {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--text);
  margin: 15px 0;
  text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
}

.btn-claim {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #ffd700, #b8860b);
  color: #050505;
  font-size: 18px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
  transition: all 0.2s ease;
}

.btn-claim:disabled {
  background: #2a2a30;
  color: var(--muted);
  box-shadow: none;
  cursor: not-allowed;
}

.user-info {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}
</style>
</head>

<body>

<div class="container">

  <!-- مربع تسجيل الدخول العلوي -->
  <div class="card-auth" id="authBox">
    <div class="auth-title" id="authTitle">تسجيل الدخول / حساب جديد</div>
    
    <div id="authFields">
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" class="input-control" placeholder="example@gmail.com">
      </div>
      
      <div class="input-group">
        <label>كلمة السر</label>
        <input type="password" id="password" class="input-control" placeholder="******">
      </div>

      <button class="btn-auth" id="loginBtn">دخول / حفظ الحساب</button>
    </div>

    <div class="auth-status" id="authStatus"></div>
    <div class="user-info" id="userInfo" style="display:none;"></div>
  </div>

  <!-- مربع العداد والزر -->
  <div class="card-timer">
    <div class="points-badge">⭐ رصيدك: <span id="userPoints">0</span> نقطة</div>
    
    <div style="font-size: 13px; color: var(--muted);">الوقت المتبقي للمكافأة القادمة:</div>
    <div class="timer-display" id="timer">24:00:00</div>

    <button class="btn-claim" id="claimBtn" disabled>استلام المكافأة اليومية</button>
  </div>

</div>

<script type="module">
import { initializeApp } 
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { 
  getAuth, 
  signInAnonymously, 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword, 
  linkWithCredential, 
  EmailAuthProvider, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { 
  getDatabase, 
  ref, 
  onValue, 
  set, 
  get 
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVg6fylaZjhgtAl_h_LNIOpExpBa0FZ21g",
  authDomain: "vezash.firebaseapp.com",
  databaseURL: "https://vezash-default-rtdb.firebaseio.com",
  projectId: "vezash",
  storageBucket: "vezash.firebasestorage.app",
  messagingSenderId: "1069891769244",
  appId: "1:1069891769244:web:1056f47de64789c1406e59"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const DAY_MS = 24 * 60 * 60 * 1000; // 24 ساعة
let currentUser = null;
let lastClaimTime = 0;
let points = 0;

const $ = id => document.getElementById(id);

// تسجيل الدخول أو إنشاء حساب
$("loginBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value.trim();
  const status = $("authStatus");

  if (!email || !password) {
    status.textContent = "ادخل البريد وكلمة السر.";
    status.className = "auth-status error";
    return;
  }

  status.textContent = "جاري الحفظ…";
  status.className = "auth-status";

  try {
    if (currentUser && currentUser.isAnonymous) {
      try {
        const cred = EmailAuthProvider.credential(email, password);
        await linkWithCredential(currentUser, cred);
        status.textContent = "تم ربط حسابك بنجاح!";
      } catch (e) {
        if (e.code === "auth/email-already-in-use") {
          await signInWithEmailAndPassword(auth, email, password);
          status.textContent = "تم تسجيل الدخول بنجاح!";
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
          status.textContent = "تم إنشاء الحساب بنجاح!";
        }
      }
    } else {
      await signInWithEmailAndPassword(auth, email, password);
      status.textContent = "تم تسجيل الدخول بنجاح!";
    }
    status.className = "auth-status ok";
  } catch (err) {
    status.textContent = "خطأ: " + (err.code || err.message);
    status.className = "auth-status error";
  }
});

// عند الضغط على زر الاستلام مرة واحدة كل 24 ساعة
$("claimBtn").addEventListener("click", async () => {
  if (!currentUser) return;

  const now = Date.now();
  if (now - lastClaimTime < DAY_MS) return;

  points += 100; // مكافأة 100 نقطة
  lastClaimTime = now;

  // حفظ بالـ Firebase
  await set(ref(db, "users/" + currentUser.uid), {
    points: points,
    lastClaim: lastClaimTime
  });

  updateUI();
});

// مراقبة حالة الحساب والبيانات
onAuthStateChanged(auth, user => {
  if (!user) {
    signInAnonymously(auth);
    return;
  }

  currentUser = user;

  if (!user.isAnonymous) {
    $("authTitle").textContent = "حسابك مفعّل 🔐";
    $("authFields").style.display = "none";
    $("userInfo").style.display = "block";
    $("userInfo").textContent = "البريد: " + user.email;
  }

  // جلب البيانات من قاعدة البيانات
  onValue(ref(db, "users/" + user.uid), snapshot => {
    const data = snapshot.val() || {};
    points = data.points || 0;
    lastClaimTime = data.lastClaim || 0;
    updateUI();
  });
});

// تحديث العداد والزر
function updateUI() {
  $("userPoints").textContent = points;

  const now = Date.now();
  const diff = DAY_MS - (now - lastClaimTime);

  if (diff <= 0) {
    $("timer").textContent = "00:00:00";
    $("claimBtn").disabled = false;
    $("claimBtn").textContent = "اضغط للاستلام الآن 🔥";
  } else {
    $("claimBtn").disabled = true;
    $("claimBtn").textContent = "تم الاستلام اليوم ✅";

    const hrs = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
    const secs = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');

    $("timer").textContent = `${hrs}:${mins}:${secs}`;
  }
}

// تحديث العداد كل ثانية
setInterval(updateUI, 1000);
</script>
</body>
</html>
